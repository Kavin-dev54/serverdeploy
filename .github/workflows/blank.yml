name: Deploy Pipeline
 
on:
  push:
    branches: [ main ]
 
jobs:
  deploy:
    runs-on: ubuntu-latest
 
    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.HOST }} >> ~/.ssh/known_hosts
 
      - name: Deploy to server
        run: |
          ssh -tt root@${{ secrets.HOST }} bash -s << 'EOF'
          set -euxo pipefail
 
          echo "WHOAMI:"
          whoami
 
          echo "PWD:"
          pwd
 
          echo "LIST /tmp"
          ls -la /tmp
          rm -rf /tmp/pipeline
          echo "CREATE DIR"
          mkdir -p /tmp/pipeline
 
          cd /tmp/pipeline
 
          echo "CLONE REPO"
          git clone https://github.com/Kavin-dev54/serverdeploy.git
 
          cd pipeline
          ls -la
 
