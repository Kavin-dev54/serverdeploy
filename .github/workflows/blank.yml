name: Deploy HTML

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Show Files
        run: ls -la

      - name: Upload HTML using SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PASSWORD }}
          port: ${{ secrets.PORT }}
          script: |
            echo "Connected"

            cat > /tmp/index.html << 'EOF'
            <!DOCTYPE html>
            <html>
            <head>
              <title>GitHub Actions</title>
            </head>
            <body>

              <h1>Deployment Success</h1>

            </body>
            </html>
            EOF

            echo "File Created"

            ls -la /tmp/

            cat /tmp/index.html
