<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevOps Pipeline Demo</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0f172a;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            text-align: center;
            background: #1e293b;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 0 20px rgba(255,255,255,0.1);
        }

        h1 {
            color: #38bdf8;
        }

        p {
            color: #cbd5e1;
        }

        .success {
            margin-top: 20px;
            color: #22c55a;
            font-weight: bold;
        }

        button {
            margin-top: 20px;
            padding: 10px 20px;
            border: none;
            background: #38bdf8;
            color: white;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #0284c7;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>CI/CD Deployment Successful 🚀</h1>

        <p>
            This HTML page was deployed using
            GitHub Actions Pipeline.
        </p>

        <div class="success">
            Server Deployment Working Successfully
        </div>

        <button onclick="showMessage()">
            Click Me
        </button>
    </div>

    <script>
        function showMessage() {
            alert("GitHub Actions Deployment Working!");
        }
    </script>

</body>
</html>
